<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>С 23 февраля! 🇷🇺 Поздравления защитникам</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2a5a3a 0%, #1a3a2a 100%);
            min-height: 100vh;
            color: #e8d9b5;
        }

        /* Военный камуфляж */
        .camouflage {
            background-image: 
                radial-gradient(circle at 30% 40%, #3a6b4a 8px, transparent 8px),
                radial-gradient(circle at 70% 60%, #4a7b5a 12px, transparent 12px),
                radial-gradient(circle at 40% 80%, #2a4a32 15px, transparent 15px),
                linear-gradient(45deg, #2d5a3d 25%, #1f4a2f 25%, #1f4a2f 50%, #2d5a3d 50%, #2d5a3d 75%, #1f4a2f 75%, #1f4a2f 100%);
            background-size: 60px 60px, 80px 80px, 100px 100px, 30px 30px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -2;
            opacity: 0.3;
        }

        /* Звезды по углам */
        .star-decoration {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .star-decoration::before,
        .star-decoration::after {
            content: "★";
            position: absolute;
            font-size: 40px;
            color: rgba(255, 215, 0, 0.2);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .star-decoration::before {
            top: 10px;
            left: 10px;
            transform: rotate(-15deg);
        }

        .star-decoration::after {
            bottom: 10px;
            right: 10px;
            font-size: 60px;
            transform: rotate(15deg);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 12px;
            position: relative;
            z-index: 1;
        }

        /* Шапка */
        .header {
            text-align: center;
            padding: 20px 15px;
            background: rgba(30, 40, 30, 0.8);
            border-radius: 12px;
            border: 2px solid #b8860b;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: "⚔️";
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 30px;
            opacity: 0.2;
        }

        .header::after {
            content: "⚔️";
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%) scaleX(-1);
            font-size: 30px;
            opacity: 0.2;
        }

        h1 {
            font-size: clamp(28px, 8vw, 42px);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0 #3a2a1a, 4px 4px 0 #b8860b;
            color: #ffd700;
            margin-bottom: 8px;
            font-family: 'Impact', 'Arial Black', sans-serif;
            word-break: break-word;
        }

        h2 {
            font-size: clamp(16px, 4vw, 22px);
            color: #c0c0c0;
            text-shadow: 1px 1px 0 #2a3a2a;
        }

        /* Кнопки авторизации */
        .auth-section {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-auth {
            padding: 10px 16px;
            background: linear-gradient(135deg, #3a5a3a, #1a3a1a);
            border: 2px solid #b8860b;
            color: #ffd700;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
            -webkit-tap-highlight-color: transparent;
        }

        .btn-auth:active {
            transform: scale(0.95);
            background: linear-gradient(135deg, #2a4a2a, #0a2a0a);
        }

        /* Форма отправки */
        .greeting-form {
            background: rgba(20, 30, 20, 0.9);
            border: 2px solid #b8860b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .form-title {
            font-size: 24px;
            color: #ffd700;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 2px solid #b8860b;
            padding-bottom: 12px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #c0c0c0;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        input, textarea {
            width: 100%;
            padding: 14px;
            background: rgba(10, 20, 10, 0.8);
            border: 2px solid #5a7a5a;
            color: #e8d9b5;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
            -webkit-appearance: none;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #b8860b;
            box-shadow: 0 0 10px rgba(184, 134, 11, 0.5);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .btn-submit {
            background: linear-gradient(135deg, #b8860b, #8b6508);
            color: #1a2a1a;
            font-weight: bold;
            font-size: 18px;
            padding: 16px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            border: 2px solid #ffd700;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-submit:active {
            transform: scale(0.98);
            background: linear-gradient(135deg, #9a7008, #7a5508);
        }

        /* Панель модератора (СКРЫТА по умолчанию) */
        .moderator-panel {
            background: rgba(10, 20, 10, 0.95);
            border: 3px solid #b8860b;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            display: none; /* Скрыта по умолчанию */
        }

        .moderator-panel.visible {
            display: block; /* Показываем только модератору */
        }

        .moderator-header {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #b8860b;
        }

        .moderator-header h3 {
            font-size: 22px;
            color: #ffd700;
            text-transform: uppercase;
            text-align: center;
        }

        .moderator-email {
            color: #ffd700;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid #b8860b;
            text-align: center;
            word-break: break-all;
        }

        /* Карточки для модерации */
        .greeting-card {
            background: rgba(30, 40, 30, 0.8);
            border: 2px solid #5a7a5a;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
            transition: all 0.3s;
        }

        .greeting-card.pending {
            border-left: 8px solid #b8860b;
            background: rgba(40, 50, 40, 0.9);
        }

        .greeting-card h4 {
            font-size: 18px;
            color: #ffd700;
            margin-bottom: 8px;
            word-break: break-word;
        }

        .greeting-meta {
            display: flex;
            flex-direction: column;
            gap: 5px;
            color: #a0a0a0;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .greeting-text {
            font-size: 16px;
            margin: 12px 0;
            line-height: 1.5;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            font-style: italic;
            border-left: 3px solid #b8860b;
            word-break: break-word;
        }

        .moderator-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-moderate {
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            font-size: 16px;
            width: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-moderate:active {
            transform: scale(0.98);
        }

        .btn-approve {
            background: #2e7d32;
            color: white;
        }

        .btn-reject {
            background: #c62828;
            color: white;
        }

        /* Одобренные поздравления */
        .approved-greetings {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-top: 20px;
        }

        .approved-card {
            background: rgba(30, 40, 30, 0.9);
            border: 2px solid #b8860b;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
            animation: fadeIn 0.5s;
        }

        .approved-card:active {
            transform: scale(0.98);
        }

        .approved-card h4 {
            font-size: 20px;
            color: #ffd700;
            margin-bottom: 12px;
            border-bottom: 1px solid #b8860b;
            padding-bottom: 8px;
            word-break: break-word;
        }

        .approved-card .greeting-text {
            font-size: 16px;
            line-height: 1.5;
            color: #e8d9b5;
            margin: 12px 0;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            word-break: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Модальное окно входа */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a2a1a, #0a1a0a);
            border: 3px solid #b8860b;
            border-radius: 16px;
            padding: 25px 20px;
            max-width: 400px;
            width: 100%;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 30px;
            cursor: pointer;
            color: #b8860b;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .modal h3 {
            color: #ffd700;
            font-size: 22px;
            margin-bottom: 20px;
            text-align: center;
        }

        .status-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }

        .status-message.success {
            background: rgba(46, 125, 50, 0.3);
            color: #81c784;
        }

        .status-message.error {
            background: rgba(198, 40, 40, 0.3);
            color: #ef5350;
        }

        /* Уведомления */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            left: 20px;
            padding: 15px;
            background: linear-gradient(135deg, #1a2a1a, #0a1a0a);
            border: 2px solid #b8860b;
            border-radius: 10px;
            color: #ffd700;
            font-weight: bold;
            z-index: 2000;
            animation: slideIn 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            text-align: center;
            font-size: 14px;
        }

        @keyframes slideIn {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Подвал */
        .footer {
            text-align: center;
            padding: 20px 10px;
            margin-top: 30px;
            color: #808080;
            border-top: 1px solid #b8860b;
            font-size: 14px;
        }

        /* Индикатор загрузки */
        .loading {
            text-align: center;
            padding: 20px;
            color: #808080;
        }

        /* Пустые состояния */
        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: #808080;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="camouflage"></div>
    <div class="star-decoration"></div>

    <div class="container">
        <!-- Кнопки авторизации -->
        <div class="auth-section">
            <button class="btn-auth" onclick="showLoginModal()" id="loginBtn">Вход для модератора</button>
            <button class="btn-auth" onclick="logout()" id="logoutBtn" style="display: none;">Выйти</button>
        </div>

        <!-- Шапка -->
        <div class="header">
            <h1>С 23 февраля!</h1>
            <h2>Слава защитникам Отечества!</h2>
        </div>

        <!-- Форма отправки -->
        <div class="greeting-form">
            <div class="form-title">Отправить поздравление</div>
            <form id="greetingForm">
                <div class="form-group">
                    <label>От кого</label>
                    <input type="text" id="senderName" required placeholder="Имя или позывной">
                </div>
                <div class="form-group">
                    <label>Кому</label>
                    <input type="text" id="recipientName" required placeholder="Имя или подразделение">
                </div>
                <div class="form-group">
                    <label>Поздравление</label>
                    <textarea id="greetingText" required placeholder="Введите ваше поздравление..."></textarea>
                </div>
                <button type="submit" class="btn-submit">Отправить на модерацию</button>
            </form>
        </div>

        <!-- Одобренные поздравления -->
        <h2 style="margin: 30px 0 15px; text-align: center;">Одобренные поздравления</h2>
        <div class="approved-greetings" id="approvedGreetings">
            <div class="loading">Загрузка...</div>
        </div>

        <!-- Панель модератора (видна ТОЛЬКО после входа) -->
        <div class="moderator-panel" id="moderatorPanel">
            <div class="moderator-header">
                <h3>⚡ Панель модератора ⚡</h3>
                <span class="moderator-email" id="moderatorEmail"></span>
            </div>
            <div id="pendingGreetings"></div>
        </div>

        <!-- Модальное окно входа -->
        <div class="modal" id="loginModal">
            <div class="modal-content">
                <span class="close-modal" onclick="hideLoginModal()">&times;</span>
                <h3>Вход для модератора</h3>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail" required placeholder="moderator@mail.ru">
                    </div>
                    <div class="form-group">
                        <label>Пароль</label>
                        <input type="password" id="loginPassword" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn-submit" style="font-size: 16px; padding: 14px;">Войти</button>
                </form>
                <div id="loginStatus" class="status-message"></div>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>С праздником, защитники! 🇷🇺 23 февраля 2025</p>
    </div>

    <script>
        // Конфигурация Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBdmfklzGC_bx8F_0gNvHHzSWpZbKAk3YU",
            authDomain: "new-fad3e.firebaseapp.com",
            projectId: "new-fad3e",
            storageBucket: "new-fad3e.firebasestorage.app",
            messagingSenderId: "618276712332",
            appId: "1:618276712332:web:a1c54d2c8b653cada3f0a9"
        };

        // Инициализация Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;

        // Показать уведомление
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            notification.style.borderColor = type === 'success' ? '#2e7d32' : '#b8860b';
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Отслеживание состояния авторизации
        auth.onAuthStateChanged((user) => {
            currentUser = user;
            const moderatorPanel = document.getElementById('moderatorPanel');
            const loginBtn = document.getElementById('loginBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            
            if (user) {
                // Показываем панель модератора ТОЛЬКО для авторизованных
                document.getElementById('moderatorEmail').textContent = user.email;
                moderatorPanel.classList.add('visible');
                loginBtn.style.display = 'none';
                logoutBtn.style.display = 'inline-block';
                loadPendingGreetings();
                showNotification('Добро пожаловать, модератор!', 'success');
            } else {
                // Скрываем панель модератора для всех остальных
                moderatorPanel.classList.remove('visible');
                loginBtn.style.display = 'inline-block';
                logoutBtn.style.display = 'none';
            }
        });

        // Загрузка одобренных поздравлений
        async function loadApprovedGreetings() {
            try {
                const snapshot = await db.collection('greetings')
                    .where('status', '==', 'approved')
                    .get();
                
                const container = document.getElementById('approvedGreetings');
                container.innerHTML = '';
                
                if (snapshot.empty) {
                    container.innerHTML = '<div class="empty-state">Пока нет одобренных поздравлений</div>';
                    return;
                }
                
                // Сортируем вручную
                const greetings = [];
                snapshot.forEach(doc => {
                    greetings.push({ id: doc.id, ...doc.data() });
                });
                
                greetings.sort((a, b) => {
                    const dateA = a.createdAt ? a.createdAt.toDate() : new Date(0);
                    const dateB = b.createdAt ? b.createdAt.toDate() : new Date(0);
                    return dateB - dateA;
                });
                
                greetings.forEach(data => {
                    const card = document.createElement('div');
                    card.className = 'approved-card';
                    
                    let dateText = 'Только что';
                    if (data.createdAt) {
                        try {
                            const date = data.createdAt.toDate();
                            dateText = date.toLocaleString('ru-RU', { 
                                day: 'numeric', 
                                month: 'long', 
                                hour: '2-digit', 
                                minute: '2-digit' 
                            });
                        } catch (e) {}
                    }
                    
                    card.innerHTML = `
                        <h4>От: ${data.sender || 'Поздравляющий'}</h4>
                        <div class="greeting-meta">
                            <span>🎖️ Кому: ${data.recipient || 'Защитникам'}</span>
                            <span>📅 ${dateText}</span>
                        </div>
                        <div class="greeting-text">${data.text || 'С праздником!'}</div>
                    `;
                    container.appendChild(card);
                });
                
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                document.getElementById('approvedGreetings').innerHTML = 
                    '<div class="empty-state" style="color: #c62828;">Ошибка загрузки</div>';
            }
        }

        // Загрузка ожидающих модерации (ТОЛЬКО для модератора)
        async function loadPendingGreetings() {
            if (!currentUser) return;
            
            try {
                const snapshot = await db.collection('greetings')
                    .where('status', '==', 'pending')
                    .get();
                
                const container = document.getElementById('pendingGreetings');
                container.innerHTML = '<h4 style="margin-bottom: 15px; color: #ffd700;">Ожидают модерации:</h4>';
                
                if (snapshot.empty) {
                    container.innerHTML += '<div class="empty-state">Нет новых заявок</div>';
                    return;
                }
                
                const greetings = [];
                snapshot.forEach(doc => {
                    greetings.push({ 
                        id: doc.id, 
                        data: doc.data()
                    });
                });
                
                greetings.sort((a, b) => {
                    const dateA = a.data.createdAt ? a.data.createdAt.toDate() : new Date(0);
                    const dateB = b.data.createdAt ? b.data.createdAt.toDate() : new Date(0);
                    return dateB - dateA;
                });
                
                greetings.forEach(item => {
                    const data = item.data;
                    const card = document.createElement('div');
                    card.className = 'greeting-card pending';
                    card.id = `greeting-${item.id}`;
                    
                    let dateText = 'Только что';
                    if (data.createdAt) {
                        try {
                            const date = data.createdAt.toDate();
                            dateText = date.toLocaleString('ru-RU', { 
                                day: 'numeric', 
                                month: 'numeric', 
                                hour: '2-digit', 
                                minute: '2-digit' 
                            });
                        } catch (e) {}
                    }
                    
                    card.innerHTML = `
                        <h4>От: ${data.sender || 'Аноним'}</h4>
                        <div class="greeting-meta">
                            <span>🎯 Кому: ${data.recipient || 'Не указано'}</span>
                            <span>📅 ${dateText}</span>
                        </div>
                        <div class="greeting-text">${data.text || 'Нет текста'}</div>
                        <div class="moderator-actions">
                            <button class="btn-moderate btn-approve" onclick="moderateGreeting('${item.id}', 'approved')">✅ Одобрить</button>
                            <button class="btn-moderate btn-reject" onclick="moderateGreeting('${item.id}', 'rejected')">❌ Отклонить</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
                
            } catch (error) {
                console.error('Ошибка загрузки заявок:', error);
                document.getElementById('pendingGreetings').innerHTML = 
                    '<div class="empty-state" style="color: #c62828;">Ошибка загрузки</div>';
            }
        }

        // Модерация
        async function moderateGreeting(id, status) {
            if (!currentUser) {
                alert('Требуется авторизация');
                return;
            }
            
            try {
                await db.collection('greetings').doc(id).update({
                    status: status,
                    moderatedBy: currentUser.email,
                    moderatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                document.getElementById(`greeting-${id}`)?.remove();
                await loadApprovedGreetings();
                await loadPendingGreetings();
                
                showNotification(`Поздравление ${status === 'approved' ? 'одобрено' : 'отклонено'}!`, 'success');
                
            } catch (error) {
                console.error('Ошибка модерации:', error);
                alert('Ошибка: ' + error.message);
            }
        }

        // Отправка нового поздравления
        document.getElementById('greetingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const sender = document.getElementById('senderName').value.trim();
            const recipient = document.getElementById('recipientName').value.trim();
            const text = document.getElementById('greetingText').value.trim();
            
            if (!sender || !recipient || !text) {
                alert('Заполните все поля');
                return;
            }
            
            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Отправка...';
            
            try {
                await db.collection('greetings').add({
                    sender: sender,
                    recipient: recipient,
                    text: text,
                    status: 'pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                alert('Поздравление отправлено на модерацию!');
                e.target.reset();
                showNotification('Отправлено!', 'success');
                
                if (currentUser) loadPendingGreetings();
                
            } catch (error) {
                alert('Ошибка: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Отправить на модерацию';
            }
        });

        // Авторизация
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const statusDiv = document.getElementById('loginStatus');
            const submitBtn = e.target.querySelector('button[type="submit"]');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Вход...';
            
            try {
                await auth.signInWithEmailAndPassword(email, password);
                statusDiv.textContent = 'Успешный вход!';
                statusDiv.className = 'status-message success';
                setTimeout(() => {
                    hideLoginModal();
                    statusDiv.textContent = '';
                }, 1000);
            } catch (error) {
                statusDiv.textContent = 'Ошибка: ' + error.message;
                statusDiv.className = 'status-message error';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Войти';
            }
        });

        // Выход
        async function logout() {
            try {
                await auth.signOut();
                showNotification('Вы вышли');
            } catch (error) {
                console.error('Ошибка выхода:', error);
            }
        }

        function showLoginModal() {
            document.getElementById('loginModal').classList.add('active');
        }

        function hideLoginModal() {
            document.getElementById('loginModal').classList.remove('active');
            document.getElementById('loginForm').reset();
            document.getElementById('loginStatus').textContent = '';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('loginModal');
            if (event.target === modal) {
                hideLoginModal();
            }
        }

        // Загрузка при старте
        document.addEventListener('DOMContentLoaded', () => {
            loadApprovedGreetings();
        });

        // Экспорт функций
        window.showLoginModal = showLoginModal;
        window.hideLoginModal = hideLoginModal;
        window.logout = logout;
        window.moderateGreeting = moderateGreeting;
    </script>
</body>
</html>
