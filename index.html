<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С 23 февраля! 🇷🇺 Поздравления защитникам</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2a5a3a 0%, #1a3a2a 100%);
            min-height: 100vh;
            color: #e8d9b5;
        }

        .camouflage {
            background-image: 
                radial-gradient(circle at 30% 40%, #3a6b4a 8px, transparent 8px),
                radial-gradient(circle at 70% 60%, #4a7b5a 12px, transparent 12px),
                radial-gradient(circle at 40% 80%, #2a4a32 15px, transparent 15px),
                linear-gradient(45deg, #2d5a3d 25%, #1f4a2f 25%, #1f4a2f 50%, #2d5a3d 50%, #2d5a3d 75%, #1f4a2f 75%, #1f4a2f 100%);
            background-size: 80px 80px, 100px 100px, 120px 120px, 40px 40px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -2;
            opacity: 0.3;
        }

        .star-decoration {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .star-decoration::before,
        .star-decoration::after {
            content: "★";
            position: absolute;
            font-size: 60px;
            color: rgba(255, 215, 0, 0.2);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .star-decoration::before {
            top: 20px;
            left: 20px;
            transform: rotate(-15deg);
        }

        .star-decoration::after {
            bottom: 20px;
            right: 20px;
            font-size: 80px;
            transform: rotate(15deg);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            padding: 30px 20px;
            background: rgba(30, 40, 30, 0.8);
            border-radius: 15px;
            border: 2px solid #b8860b;
            margin-bottom: 30px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: "⚔️";
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 40px;
            opacity: 0.3;
        }

        .header::after {
            content: "⚔️";
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%) scaleX(-1);
            font-size: 40px;
            opacity: 0.3;
        }

        h1 {
            font-size: 48px;
            text-transform: uppercase;
            letter-spacing: 8px;
            text-shadow: 3px 3px 0 #3a2a1a, 5px 5px 0 #b8860b;
            color: #ffd700;
            margin-bottom: 10px;
            font-family: 'Impact', 'Arial Black', sans-serif;
        }

        h2 {
            font-size: 24px;
            color: #c0c0c0;
            text-shadow: 2px 2px 0 #2a3a2a;
        }

        .auth-section {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-auth {
            padding: 12px 25px;
            background: linear-gradient(135deg, #3a5a3a, #1a3a1a);
            border: 2px solid #b8860b;
            color: #ffd700;
            font-weight: bold;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-auth:hover {
            background: linear-gradient(135deg, #4a6a4a, #2a4a2a);
            border-color: #ffd700;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .greeting-form {
            background: rgba(20, 30, 20, 0.9);
            border: 2px solid #b8860b;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .form-title {
            font-size: 28px;
            color: #ffd700;
            margin-bottom: 25px;
            text-align: center;
            border-bottom: 2px solid #b8860b;
            padding-bottom: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #c0c0c0;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
        }

        input, textarea {
            width: 100%;
            padding: 12px 15px;
            background: rgba(10, 20, 10, 0.8);
            border: 2px solid #5a7a5a;
            color: #e8d9b5;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #b8860b;
            box-shadow: 0 0 15px rgba(184, 134, 11, 0.5);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .btn-submit {
            background: linear-gradient(135deg, #b8860b, #8b6508);
            color: #1a2a1a;
            font-weight: bold;
            font-size: 20px;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.3s;
            border: 2px solid #ffd700;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #daa520, #b8860b);
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }

        .moderator-panel {
            background: rgba(10, 20, 10, 0.95);
            border: 3px solid #b8860b;
            border-radius: 15px;
            padding: 25px;
            margin-top: 30px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }

        .moderator-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #b8860b;
        }

        .moderator-header h3 {
            font-size: 28px;
            color: #ffd700;
            text-transform: uppercase;
        }

        .greeting-card {
            background: rgba(30, 40, 30, 0.8);
            border: 2px solid #5a7a5a;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .greeting-card.pending {
            border-left: 10px solid #b8860b;
            background: rgba(40, 50, 40, 0.9);
        }

        .greeting-card h4 {
            font-size: 20px;
            color: #ffd700;
            margin-bottom: 10px;
        }

        .greeting-meta {
            display: flex;
            gap: 20px;
            color: #a0a0a0;
            font-size: 14px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .greeting-text {
            font-size: 18px;
            margin: 15px 0;
            line-height: 1.6;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            font-style: italic;
            border-left: 3px solid #b8860b;
        }

        .moderator-actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .btn-moderate {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            flex: 1;
            font-size: 16px;
        }

        .btn-approve {
            background: #2e7d32;
            color: white;
        }

        .btn-approve:hover {
            background: #1b5e20;
            box-shadow: 0 0 15px #2e7d32;
        }

        .btn-reject {
            background: #c62828;
            color: white;
        }

        .btn-reject:hover {
            background: #b71c1c;
            box-shadow: 0 0 15px #c62828;
        }

        .approved-greetings {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .approved-card {
            background: rgba(30, 40, 30, 0.9);
            border: 2px solid #b8860b;
            border-radius: 15px;
            padding: 25px;
            transition: all 0.3s;
            animation: fadeIn 0.5s;
        }

        .approved-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-color: #ffd700;
        }

        .approved-card h4 {
            font-size: 22px;
            color: #ffd700;
            margin-bottom: 15px;
            border-bottom: 1px solid #b8860b;
            padding-bottom: 10px;
        }

        .approved-card .greeting-text {
            font-size: 18px;
            line-height: 1.6;
            color: #e8d9b5;
            margin: 15px 0;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a2a1a, #0a1a0a);
            border: 3px solid #b8860b;
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 30px;
            cursor: pointer;
            color: #b8860b;
        }

        .modal h3 {
            color: #ffd700;
            font-size: 24px;
            margin-bottom: 25px;
            text-align: center;
        }

        .status-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }

        .status-message.success {
            background: rgba(46, 125, 50, 0.3);
            color: #81c784;
        }

        .status-message.error {
            background: rgba(198, 40, 40, 0.3);
            color: #ef5350;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            background: linear-gradient(135deg, #1a2a1a, #0a1a0a);
            border: 2px solid #b8860b;
            border-radius: 10px;
            color: #ffd700;
            font-weight: bold;
            z-index: 2000;
            animation: slideIn 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .footer {
            text-align: center;
            padding: 20px;
            margin-top: 50px;
            color: #808080;
            border-top: 1px solid #b8860b;
        }

        .moderator-email {
            color: #ffd700;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid #b8860b;
        }
    </style>
</head>
<body>
    <div class="camouflage"></div>
    <div class="star-decoration"></div>

    <div class="container">
        <div class="auth-section">
            <button class="btn-auth" onclick="showLoginModal()">Вход для модератора</button>
            <button class="btn-auth" onclick="logout()" id="logoutBtn" style="display: none;">Выйти</button>
        </div>

        <div class="header">
            <h1>С 23 февраля!</h1>
            <h2>Слава защитникам Отечества!</h2>
        </div>

        <!-- Форма отправки поздравления - БЕЗ ВОИНСКИХ ЗВАНИЙ -->
        <div class="greeting-form">
            <div class="form-title">Отправить поздравление</div>
            <form id="greetingForm">
                <div class="form-group">
                    <label>От кого (Имя, позывной)</label>
                    <input type="text" id="senderName" required placeholder="Например: Иван Петров">
                </div>
                <div class="form-group">
                    <label>Кому (Имя, подразделение)</label>
                    <input type="text" id="recipientName" required placeholder="Например: Защитникам Отечества">
                </div>
                <div class="form-group">
                    <label>Поздравление</label>
                    <textarea id="greetingText" required placeholder="Введите ваше поздравление..."></textarea>
                </div>
                <button type="submit" class="btn-submit">Отправить на модерацию</button>
            </form>
        </div>

        <!-- Одобренные поздравления -->
        <h2 style="margin: 40px 0 20px; text-align: center;">Одобренные поздравления</h2>
        <div class="approved-greetings" id="approvedGreetings">
            <p style="text-align: center; color: #808080; grid-column: 1/-1;">Загрузка...</p>
        </div>

        <!-- Панель модератора -->
        <div class="moderator-panel" id="moderatorPanel" style="display: none;">
            <div class="moderator-header">
                <h3>⚡ Панель модератора ⚡</h3>
                <span class="moderator-email" id="moderatorEmail"></span>
            </div>
            <div id="pendingGreetings"></div>
        </div>

        <!-- Модальное окно входа -->
        <div class="modal" id="loginModal">
            <div class="modal-content">
                <span class="close-modal" onclick="hideLoginModal()">&times;</span>
                <h3>Вход для модератора</h3>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail" required>
                    </div>
                    <div class="form-group">
                        <label>Пароль</label>
                        <input type="password" id="loginPassword" required>
                    </div>
                    <button type="submit" class="btn-submit" style="font-size: 16px; padding: 12px;">Войти</button>
                </form>
                <div id="loginStatus" class="status-message"></div>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>С праздником, защитники! 🇷🇺 23 февраля 2025</p>
    </div>

    <script>
        // Конфигурация Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBdmfklzGC_bx8F_0gNvHHzSWpZbKAk3YU",
            authDomain: "new-fad3e.firebaseapp.com",
            projectId: "new-fad3e",
            storageBucket: "new-fad3e.firebasestorage.app",
            messagingSenderId: "618276712332",
            appId: "1:618276712332:web:a1c54d2c8b653cada3f0a9"
        };

        // Инициализация Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;

        // Показать уведомление
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            notification.style.borderColor = type === 'success' ? '#2e7d32' : '#b8860b';
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Отслеживание состояния авторизации
        auth.onAuthStateChanged((user) => {
            currentUser = user;
            const moderatorPanel = document.getElementById('moderatorPanel');
            const logoutBtn = document.getElementById('logoutBtn');
            
            if (user) {
                document.getElementById('moderatorEmail').textContent = user.email;
                moderatorPanel.style.display = 'block';
                logoutBtn.style.display = 'inline-block';
                loadPendingGreetings();
                showNotification('Добро пожаловать, модератор!', 'success');
            } else {
                moderatorPanel.style.display = 'none';
                logoutBtn.style.display = 'none';
            }
        });

        // Загрузка одобренных поздравлений
        async function loadApprovedGreetings() {
            try {
                const snapshot = await db.collection('greetings')
                    .where('status', '==', 'approved')
                    .orderBy('createdAt', 'desc')
                    .get();
                
                const container = document.getElementById('approvedGreetings');
                container.innerHTML = '';
                
                if (snapshot.empty) {
                    container.innerHTML = '<p style="text-align: center; color: #808080; grid-column: 1/-1;">Пока нет одобренных поздравлений</p>';
                    return;
                }
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const card = document.createElement('div');
                    card.className = 'approved-card';
                    
                    let dateText = 'Только что';
                    if (data.createdAt) {
                        try {
                            const date = data.createdAt.toDate();
                            dateText = date.toLocaleString('ru-RU', { 
                                day: 'numeric', 
                                month: 'long', 
                                hour: '2-digit', 
                                minute: '2-digit' 
                            });
                        } catch (e) {
                            console.error('Ошибка форматирования даты:', e);
                        }
                    }
                    
                    card.innerHTML = `
                        <h4>От: ${data.sender || 'Поздравляющий'}</h4>
                        <div class="greeting-meta">
                            <span>🎖️ Кому: ${data.recipient || 'Защитникам'}</span>
                            <span>📅 ${dateText}</span>
                        </div>
                        <div class="greeting-text">${data.text || 'С праздником!'}</div>
                    `;
                    container.appendChild(card);
                });
                
            } catch (error) {
                console.error('Ошибка загрузки одобренных:', error);
                document.getElementById('approvedGreetings').innerHTML = 
                    '<p style="color: #c62828; grid-column: 1/-1;">Ошибка загрузки поздравлений</p>';
            }
        }

        // Загрузка ожидающих модерации
        async function loadPendingGreetings() {
            if (!currentUser) return;
            
            try {
                const snapshot = await db.collection('greetings')
                    .where('status', '==', 'pending')
                    .orderBy('createdAt', 'desc')
                    .get();
                
                const container = document.getElementById('pendingGreetings');
                container.innerHTML = '<h4 style="margin-bottom: 20px; color: #ffd700;">Ожидают модерации:</h4>';
                
                if (snapshot.empty) {
                    container.innerHTML += '<p style="color: #808080;">Нет новых заявок</p>';
                    return;
                }
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const card = document.createElement('div');
                    card.className = 'greeting-card pending';
                    card.id = `greeting-${doc.id}`;
                    
                    let dateText = 'Только что';
                    if (data.createdAt) {
                        try {
                            const date = data.createdAt.toDate();
                            dateText = date.toLocaleString('ru-RU', { 
                                day: 'numeric', 
                                month: 'numeric', 
                                hour: '2-digit', 
                                minute: '2-digit' 
                            });
                        } catch (e) {
                            console.error('Ошибка форматирования даты:', e);
                        }
                    }
                    
                    card.innerHTML = `
                        <h4>От: ${data.sender || 'Аноним'}</h4>
                        <div class="greeting-meta">
                            <span>🎯 Кому: ${data.recipient || 'Не указано'}</span>
                            <span>📅 ${dateText}</span>
                        </div>
                        <div class="greeting-text">${data.text || 'Нет текста'}</div>
                        <div class="moderator-actions">
                            <button class="btn-moderate btn-approve" onclick="moderateGreeting('${doc.id}', 'approved')">✅ Одобрить</button>
                            <button class="btn-moderate btn-reject" onclick="moderateGreeting('${doc.id}', 'rejected')">❌ Отклонить</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
                
            } catch (error) {
                console.error('Ошибка загрузки заявок:', error);
                document.getElementById('pendingGreetings').innerHTML = 
                    '<p style="color: #c62828;">Ошибка загрузки заявок</p>';
            }
        }

        // Модерация поздравления
        async function moderateGreeting(id, status) {
            if (!currentUser) {
                alert('Требуется авторизация');
                return;
            }
            
            try {
                await db.collection('greetings').doc(id).update({
                    status: status,
                    moderatedBy: currentUser.email,
                    moderatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                const element = document.getElementById(`greeting-${id}`);
                if (element) {
                    element.remove();
                }
                
                await loadApprovedGreetings();
                
                const statusText = status === 'approved' ? 'одобрено' : 'отклонено';
                showNotification(`Поздравление ${statusText}!`, 'success');
                
                // Проверяем, остались ли заявки
                const pendingContainer = document.getElementById('pendingGreetings');
                const pendingCards = pendingContainer.querySelectorAll('.greeting-card');
                if (pendingCards.length === 0) {
                    pendingContainer.innerHTML = '<h4 style="margin-bottom: 20px; color: #ffd700;">Ожидают модерации:</h4><p style="color: #808080;">Нет новых заявок</p>';
                }
                
            } catch (error) {
                console.error('Ошибка модерации:', error);
                alert('Ошибка при модерации: ' + error.message);
            }
        }

        // Отправка нового поздравления
        document.getElementById('greetingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const sender = document.getElementById('senderName').value.trim();
            const recipient = document.getElementById('recipientName').value.trim();
            const text = document.getElementById('greetingText').value.trim();
            
            if (!sender || !recipient || !text) {
                alert('Пожалуйста, заполните все поля');
                return;
            }
            
            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Отправка...';
            
            try {
                const greetingData = {
                    sender: sender,
                    recipient: recipient,
                    text: text,
                    status: 'pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                };
                
                await db.collection('greetings').add(greetingData);
                
                alert('Поздравление отправлено на модерацию!');
                e.target.reset();
                showNotification('Поздравление отправлено!', 'success');
                
            } catch (error) {
                console.error('Ошибка отправки:', error);
                alert('Ошибка при отправке: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Отправить на модерацию';
            }
        });

        // Авторизация
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const statusDiv = document.getElementById('loginStatus');
            const submitBtn = e.target.querySelector('button[type="submit"]');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Вход...';
            
            try {
                await auth.signInWithEmailAndPassword(email, password);
                statusDiv.textContent = 'Успешный вход!';
                statusDiv.className = 'status-message success';
                setTimeout(() => {
                    hideLoginModal();
                    statusDiv.textContent = '';
                }, 1000);
            } catch (error) {
                statusDiv.textContent = 'Ошибка: ' + error.message;
                statusDiv.className = 'status-message error';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Войти';
            }
        });

        // Выход
        async function logout() {
            try {
                await auth.signOut();
                showNotification('Вы вышли из системы');
            } catch (error) {
                console.error('Ошибка выхода:', error);
            }
        }

        function showLoginModal() {
            document.getElementById('loginModal').classList.add('active');
        }

        function hideLoginModal() {
            document.getElementById('loginModal').classList.remove('active');
            document.getElementById('loginForm').reset();
            document.getElementById('loginStatus').textContent = '';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('loginModal');
            if (event.target === modal) {
                hideLoginModal();
            }
        }

        // Загрузка данных при старте
        document.addEventListener('DOMContentLoaded', () => {
            loadApprovedGreetings();
        });

        // Экспорт функций
        window.showLoginModal = showLoginModal;
        window.hideLoginModal = hideLoginModal;
        window.logout = logout;
        window.moderateGreeting = moderateGreeting;
    </script>
</body>
</html>
