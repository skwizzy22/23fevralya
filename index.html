<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С 23 февраля | Защитникам Отечества</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --army-green: #2b4b2b;
            --army-dark: #1a2f1a;
            --army-olive: #4a674a;
            --sand: #9b8a6b;
            --steel: #4a5b6e;
            --gold: #c4a55c;
            --blood: #8b2c2c;
            --camouflage-1: #3d523d;
            --camouflage-2: #5d7052;
            --camouflage-3: #7f8c6b;
        }

        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: #1a2f1a;
            min-height: 100vh;
            color: #e8e0c9;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 30% 40%, var(--camouflage-1) 8%, transparent 8%),
                radial-gradient(circle at 70% 60%, var(--camouflage-2) 12%, transparent 12%),
                radial-gradient(circle at 20% 80%, var(--camouflage-3) 6%, transparent 6%),
                radial-gradient(circle at 85% 25%, var(--camouflage-1) 10%, transparent 10%),
                radial-gradient(circle at 45% 70%, var(--camouflage-2) 15%, transparent 15%),
                radial-gradient(circle at 15% 30%, var(--camouflage-3) 7%, transparent 7%),
                linear-gradient(45deg, var(--camouflage-1) 0%, var(--camouflage-2) 30%, var(--camouflage-3) 70%);
            background-size: 250px 250px;
            opacity: 0.3;
            z-index: -1;
        }

        header {
            background: linear-gradient(135deg, var(--army-dark) 0%, var(--army-green) 100%);
            color: var(--gold);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--gold);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: relative;
            z-index: 10;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 2px 2px 0 var(--army-dark);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        header h1::before, header h1::after {
            content: '⭐';
            font-size: 2.2rem;
            filter: drop-shadow(0 0 5px var(--gold));
        }

        nav {
            display: flex;
            gap: 15px;
        }

        nav a {
            color: #e8e0c9;
            text-decoration: none;
            padding: 8px 25px;
            transition: all 0.3s ease;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            border: 2px solid transparent;
            background: rgba(0, 0, 0, 0.3);
        }

        nav a:hover {
            border-color: var(--gold);
            background: rgba(196, 165, 92, 0.2);
            transform: translateY(-2px);
        }

        nav a.active {
            background: var(--gold);
            color: var(--army-dark);
            border-color: var(--gold);
        }

        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 20px;
        }

        section {
            background: rgba(26, 47, 26, 0.9);
            backdrop-filter: blur(5px);
            border: 2px solid var(--gold);
            padding: 2.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        section::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            width: 30px;
            height: 30px;
            border-top: 3px solid var(--gold);
            border-left: 3px solid var(--gold);
        }

        section::after {
            content: '';
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            border-bottom: 3px solid var(--gold);
            border-right: 3px solid var(--gold);
        }

        h2 {
            color: var(--gold);
            margin-bottom: 2rem;
            font-size: 2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 0.5rem;
            display: inline-block;
        }

        .search-section {
            background: linear-gradient(135deg, rgba(26, 47, 26, 0.95), rgba(43, 75, 43, 0.95));
            border-color: var(--gold);
        }

        .search-section input {
            flex: 1;
            min-width: 250px;
            padding: 15px 25px;
            border: 2px solid var(--sand);
            background: rgba(0, 0, 0, 0.5);
            color: #e8e0c9;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .search-section input:focus {
            outline: none;
            border-color: var(--gold);
            background: rgba(0, 0, 0, 0.7);
        }

        button {
            background: transparent;
            color: var(--gold);
            border: 2px solid var(--gold);
            padding: 15px 35px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            background: var(--gold);
            color: var(--army-dark);
            box-shadow: 0 0 20px var(--gold);
        }

        .form-group {
            margin-bottom: 2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.8rem;
            font-weight: 600;
            color: var(--gold);
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid var(--sand);
            background: rgba(0, 0, 0, 0.5);
            color: #e8e0c9;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--gold);
            background: rgba(0, 0, 0, 0.7);
        }

        .greeting-card {
            background: linear-gradient(135deg, var(--army-dark), var(--army-green));
            border: 2px solid var(--gold);
            padding: 2rem;
            margin-bottom: 1.5rem;
            position: relative;
            transition: all 0.3s ease;
        }

        .greeting-card:hover {
            transform: translateX(10px);
            border-color: var(--gold);
            box-shadow: -5px 5px 20px rgba(0,0,0,0.5);
        }

        .greeting-card .from {
            color: var(--sand);
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .greeting-card .to {
            color: var(--gold);
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .greeting-card .message {
            font-style: italic;
            background: rgba(0, 0, 0, 0.5);
            padding: 1.5rem;
            margin: 1rem 0;
            font-size: 1.1rem;
            line-height: 1.6;
            border-left: 4px solid var(--gold);
            color: #e8e0c9;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--army-dark);
            border: 3px solid var(--gold);
            padding: 3rem;
            max-width: 400px;
            width: 90%;
            position: relative;
            box-shadow: 0 0 50px var(--gold);
        }

        .modal-content h2 {
            color: var(--gold);
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 1rem;
        }

        .modal-content input {
            width: 100%;
            padding: 15px;
            margin-bottom: 1.5rem;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--sand);
            color: #e8e0c9;
            font-size: 1rem;
        }

        .modal-content button {
            width: 100%;
        }

        .error-message {
            color: var(--blood);
            text-align: center;
            margin-top: 1rem;
            display: none;
        }

        .moderation-section {
            border-color: var(--blood);
        }

        .moderation-section h2 {
            color: var(--blood);
            border-bottom-color: var(--blood);
        }

        .moderation-item {
            background: linear-gradient(135deg, #2a1a1a, #3b2a2a);
            border: 2px solid var(--blood);
            padding: 2rem;
            margin-bottom: 1.5rem;
            position: relative;
        }

        .moderation-item p {
            margin: 0.8rem 0;
            font-size: 1.1rem;
            color: #e8e0c9;
        }

        .moderation-item strong {
            color: var(--blood);
            font-weight: 600;
        }

        .actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .actions button {
            flex: 1;
            padding: 12px;
        }

        .approve {
            border-color: #2b4b2b;
            color: #2b4b2b;
        }

        .approve:hover {
            background: #2b4b2b;
            color: var(--gold);
        }

        .reject {
            border-color: var(--blood);
            color: var(--blood);
        }

        .reject:hover {
            background: var(--blood);
            color: var(--gold);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--sand);
            font-size: 1.2rem;
            border: 2px dashed var(--gold);
        }

        .empty-state::before {
            content: '🎖';
            font-size: 4rem;
            display: block;
            margin-bottom: 1rem;
            opacity: 0.7;
        }

        .loading {
            text-align: center;
            color: var(--sand);
            padding: 3rem;
            font-size: 1.2rem;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            margin-left: 10px;
            border: 3px solid var(--gold);
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .page {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .hidden {
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .result-card {
            background: linear-gradient(135deg, var(--army-dark), var(--army-green));
            border: 2px solid var(--gold);
            padding: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
        }

        .result-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                text-align: center;
                gap: 1rem;
                padding: 1rem;
            }
            
            nav {
                width: 100%;
                justify-content: center;
            }
            
            .search-section {
                flex-direction: column;
            }
            
            .search-section button {
                width: 100%;
            }
            
            section {
                padding: 1.5rem;
            }
            
            h2 {
                font-size: 1.6rem;
            }
            
            .actions {
                flex-direction: column;
            }
            
            .modal-content {
                padding: 2rem;
            }
        }

        .secret-entry {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: var(--army-dark);
            border: 2px solid var(--gold);
            cursor: pointer;
            opacity: 0.3;
            transition: all 0.3s;
            z-index: 100;
        }

        .secret-entry:hover {
            opacity: 1;
            background: var(--gold);
        }

        .secret-entry::before {
            content: '⚙️';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
        }

        .logout-btn {
            background: transparent;
            border-color: var(--blood);
            color: var(--blood);
            padding: 5px 15px;
            font-size: 0.8rem;
            margin-left: 10px;
        }

        .logout-btn:hover {
            background: var(--blood);
            color: var(--gold);
        }

        .user-email {
            color: var(--gold);
            margin-right: 15px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>23 ФЕВРАЛЯ</h1>
        <nav>
            <a onclick="showPage('main')" id="nav-main" class="active">ГЛАВНАЯ</a>
            <a onclick="showModerationLogin()" id="nav-admin">ШТАБ</a>
        </nav>
    </header>

    <!-- Секретный вход -->
    <div class="secret-entry" onclick="showModerationLogin()" title="Вход для командования"></div>

    <!-- Модальное окно для входа -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <h2>ВХОД В ШТАБ</h2>
            <input type="email" id="admin-email" placeholder="Email" value="vadaiat4@gmail.com">
            <input type="password" id="admin-password" placeholder="Пароль" onkeypress="if(event.key==='Enter') loginWithEmail()">
            <button onclick="loginWithEmail()">ВОЙТИ</button>
            <div id="login-error" class="error-message"></div>
        </div>
    </div>

    <main>
        <!-- Главная страница -->
        <div id="main-page" class="page">
            <section class="search-section">
                <h2>НАЙТИ ЗАЩИТНИКА ⭐</h2>
                <input type="text" id="search-name" placeholder="Введите имя бойца..." autocomplete="off">
                <button onclick="searchGreetings()">🔍 НАЙТИ</button>
            </section>

            <section class="create-section">
                <h2>ДОБАВИТЬ ПОЗДРАВЛЕНИЕ ⭐</h2>
                <form id="greeting-form" onsubmit="event.preventDefault(); addGreeting();">
                    <div class="form-group">
                        <label for="from-name">ОТ КОГО (Позывной)</label>
                        <input type="text" id="from-name" placeholder="Ваше имя" required>
                    </div>
                    <div class="form-group">
                        <label for="to-name">КОМУ (Имя защитника)</label>
                        <input type="text" id="to-name" placeholder="Имя бойца" required>
                    </div>
                    <div class="form-group">
                        <label for="message">ТЕКСТ ПОЗДРАВЛЕНИЯ</label>
                        <textarea id="message" rows="4" placeholder="Ваши пожелания..." required></textarea>
                    </div>
                    <button type="submit">📨 ОТПРАВИТЬ В ШТАБ</button>
                </form>
            </section>

            <section class="results-section" id="results-section" style="display: none;">
                <h2>РЕЗУЛЬТАТЫ ПОИСКА ⭐</h2>
                <div id="results-container" class="results-grid"></div>
            </section>
        </div>

        <!-- Страница модерации -->
        <div id="admin-page" class="page hidden">
            <section class="moderation-section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                    <h2>ЗАЯВКИ НА ПРОВЕРКУ</h2>
                    <div>
                        <span class="user-email" id="user-email"></span>
                        <button class="logout-btn" onclick="logout()">ВЫХОД</button>
                    </div>
                </div>
                <div id="moderation-list">
                    <p class="loading">ЗАГРУЗКА ДАННЫХ</p>
                </div>
            </section>
        </div>
    </main>

    <script>
        // ✅ ВАШИ ПРАВИЛЬНЫЕ ДАННЫЕ ИЗ НОВОГО ПРОЕКТА
        const firebaseConfig = {
            apiKey: "AIzaSyBdmfKkLzGC_bx8F_0gNvHHzSWpZbKAk3YU",
            authDomain: "new-fad3e.firebaseapp.com",
            projectId: "new-fad3e",
            storageBucket: "new-fad3e.firebasestorage.app",
            messagingSenderId: "618276712332",
            appId: "1:618276712332:web:a1c54d2c8b653cada3f0a9"
        };

        // Инициализация Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Состояние авторизации
        let isAuthenticated = false;
        
        // ✅ ВАШ USER UID
        const ADMIN_UID = "aRoG4om1DMWdaRrVjVk85XeNsV63";
        
        // ✅ ВАША ПОЧТА
        const ADMIN_EMAIL = "vadaiat4@gmail.com";

        // Проверка авторизации при загрузке
        auth.onAuthStateChanged((user) => {
            console.log("Auth state changed:", user ? user.email : "No user");
            if (user && (user.uid === ADMIN_UID || user.email === ADMIN_EMAIL)) {
                isAuthenticated = true;
                document.getElementById('user-email').textContent = user.email;
                if (!document.getElementById('admin-page').classList.contains('hidden')) {
                    loadModerationRequests();
                }
            } else {
                isAuthenticated = false;
                if (user) {
                    console.log("User not admin, signing out");
                    auth.signOut();
                }
                if (!document.getElementById('admin-page').classList.contains('hidden')) {
                    showPage('main');
                }
            }
        });

        // Показать окно входа
        function showModerationLogin() {
            if (isAuthenticated) {
                showPage('admin');
            } else {
                document.getElementById('login-modal').classList.add('active');
                document.getElementById('admin-password').value = '';
                document.getElementById('login-error').style.display = 'none';
            }
        }

        // Вход по email/паролю
        async function loginWithEmail() {
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;

            try {
                console.log("Attempting login...");
                await auth.signInWithEmailAndPassword(email, password);
                document.getElementById('login-modal').classList.remove('active');
                console.log("Login successful");
            } catch (error) {
                console.error("Login error:", error);
                document.getElementById('login-error').style.display = 'block';
                document.getElementById('login-error').textContent = 'Ошибка входа: ' + error.message;
            }
        }

        // Выход
        async function logout() {
            await auth.signOut();
            showPage('main');
        }

        // Переключение страниц
        function showPage(page) {
            const mainPage = document.getElementById('main-page');
            const adminPage = document.getElementById('admin-page');
            const navMain = document.getElementById('nav-main');
            const navAdmin = document.getElementById('nav-admin');

            if (page === 'main') {
                mainPage.classList.remove('hidden');
                adminPage.classList.add('hidden');
                navMain.classList.add('active');
                navAdmin.classList.remove('active');
            } else {
                if (!isAuthenticated) {
                    showModerationLogin();
                    return;
                }
                mainPage.classList.add('hidden');
                adminPage.classList.remove('hidden');
                navMain.classList.remove('active');
                navAdmin.classList.add('active');
                loadModerationRequests();
            }
        }

        // Загрузка заявок из Firestore
        async function loadModerationRequests() {
            const container = document.getElementById('moderation-list');
            
            if (!isAuthenticated) {
                container.innerHTML = '<div class="empty-state">Требуется авторизация</div>';
                return;
            }

            try {
                const snapshot = await db.collection('pending')
                    .orderBy('timestamp', 'desc')
                    .get();
                
                if (snapshot.empty) {
                    container.innerHTML = '<div class="empty-state">Новых заявок нет</div>';
                    return;
                }

                let html = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const date = data.timestamp?.toDate 
                        ? data.timestamp.toDate().toLocaleString('ru-RU')
                        : 'Дата неизвестна';
                    
                    html += `
                        <div class="moderation-item">
                            <p><strong>От:</strong> ${escapeHtml(data.from)}</p>
                            <p><strong>Кому:</strong> ${escapeHtml(data.to)}</p>
                            <p><strong>Поздравление:</strong></p>
                            <p class="message">${escapeHtml(data.message)}</p>
                            <p><small>${date}</small></p>
                            <div class="actions">
                                <button class="approve" onclick="approveGreeting('${doc.id}')">
                                    ✅ ОДОБРИТЬ
                                </button>
                                <button class="reject" onclick="rejectGreeting('${doc.id}')">
                                    ❌ ОТКЛОНИТЬ
                                </button>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            } catch (error) {
                console.error("Firestore error:", error);
                container.innerHTML = `<div class="empty-state">Ошибка загрузки: ${error.message}</div>`;
            }
        }

        // Добавление новой заявки
        async function addGreeting() {
            const from = document.getElementById('from-name').value;
            const to = document.getElementById('to-name').value;
            const message = document.getElementById('message').value;

            if (!from || !to || !message) {
                alert('Заполните все поля!');
                return;
            }

            try {
                await db.collection('pending').add({
                    from: from.trim(),
                    to: to.trim(),
                    message: message.trim(),
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                alert('Поздравление отправлено в штаб на проверку!');
                document.getElementById('greeting-form').reset();
            } catch (error) {
                console.error("Add greeting error:", error);
                alert('Ошибка: ' + error.message);
            }
        }

        // Одобрение заявки
        async function approveGreeting(id) {
            if (!isAuthenticated) return;

            try {
                const doc = await db.collection('pending').doc(id).get();
                const data = doc.data();
                
                await db.collection('approved').add({
                    ...data,
                    approved: true,
                    approvedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                await db.collection('pending').doc(id).delete();
                
                loadModerationRequests();
                alert('Поздравление одобрено!');
            } catch (error) {
                console.error("Approve error:", error);
                alert('Ошибка: ' + error.message);
            }
        }

        // Отклонение заявки
        async function rejectGreeting(id) {
            if (!isAuthenticated) return;
            
            if (confirm('Удалить эту заявку?')) {
                try {
                    await db.collection('pending').doc(id).delete();
                    loadModerationRequests();
                    alert('Заявка отклонена');
                } catch (error) {
                    console.error("Reject error:", error);
                    alert('Ошибка: ' + error.message);
                }
            }
        }

        // Поиск поздравлений
        async function searchGreetings() {
            const searchName = document.getElementById('search-name').value.trim().toLowerCase();
            const resultsSection = document.getElementById('results-section');
            const resultsContainer = document.getElementById('results-container');

            if (!searchName) {
                alert('Введите имя для поиска');
                return;
            }

            try {
                const snapshot = await db.collection('approved').get();
                const results = [];
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.to && data.to.toLowerCase().includes(searchName)) {
                        results.push(data);
                    }
                });

                if (results.length === 0) {
                    resultsContainer.innerHTML = `<div class="empty-state">Бойцов с именем "${searchName}" не найдено</div>`;
                } else {
                    let html = '';
                    results.forEach(greeting => {
                        html += `
                            <div class="result-card">
                                <div style="font-size: 2rem; margin-bottom: 1rem;">⭐</div>
                                <h3 style="color: var(--gold); font-size: 1.5rem; margin-bottom: 0.5rem;">${escapeHtml(greeting.to)}</h3>
                                <p style="color: var(--sand); margin-bottom: 1rem;">От: ${escapeHtml(greeting.from)}</p>
                                <p style="font-style: italic; line-height: 1.6;">"${escapeHtml(greeting.message)}"</p>
                            </div>
                        `;
                    });
                    resultsContainer.innerHTML = html;
                }

                resultsSection.style.display = 'block';
                resultsSection.scrollIntoView({ behavior: 'smooth' });
            } catch (error) {
                console.error("Search error:", error);
                alert('Ошибка поиска: ' + error.message);
            }
        }

        // Защита от XSS
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
