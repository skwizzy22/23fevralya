<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С 23 февраля | Защитникам Отечества</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Военная цветовая схема */
        :root {
            --army-green: #2b4b2b;
            --army-dark: #1a2f1a;
            --army-olive: #4a674a;
            --sand: #9b8a6b;
            --steel: #4a5b6e;
            --gold: #c4a55c;
            --blood: #8b2c2c;
            --camouflage-1: #3d523d;
            --camouflage-2: #5d7052;
            --camouflage-3: #7f8c6b;
        }

        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: #1a2f1a;
            min-height: 100vh;
            color: #e8e0c9;
            position: relative;
            overflow-x: hidden;
        }

        /* Камуфляжный фон */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 30% 40%, var(--camouflage-1) 8%, transparent 8%),
                radial-gradient(circle at 70% 60%, var(--camouflage-2) 12%, transparent 12%),
                radial-gradient(circle at 20% 80%, var(--camouflage-3) 6%, transparent 6%),
                radial-gradient(circle at 85% 25%, var(--camouflage-1) 10%, transparent 10%),
                radial-gradient(circle at 45% 70%, var(--camouflage-2) 15%, transparent 15%),
                radial-gradient(circle at 15% 30%, var(--camouflage-3) 7%, transparent 7%),
                linear-gradient(45deg, var(--camouflage-1) 0%, var(--camouflage-2) 30%, var(--camouflage-3) 70%);
            background-size: 250px 250px;
            opacity: 0.3;
            z-index: -1;
        }

        /* Военный хедер */
        header {
            background: linear-gradient(135deg, var(--army-dark) 0%, var(--army-green) 100%);
            color: var(--gold);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--gold);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: relative;
            z-index: 10;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 2px 2px 0 var(--army-dark);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        header h1::before {
            content: '⭐';
            font-size: 2.2rem;
            filter: drop-shadow(0 0 5px var(--gold));
        }

        header h1::after {
            content: '⭐';
            font-size: 2.2rem;
            filter: drop-shadow(0 0 5px var(--gold));
        }

        nav {
            display: flex;
            gap: 15px;
        }

        nav a {
            color: var(--e8e0c9);
            text-decoration: none;
            padding: 8px 25px;
            border-radius: 0;
            transition: all 0.3s ease;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            border: 2px solid transparent;
            background: rgba(0, 0, 0, 0.3);
        }

        nav a:hover {
            border-color: var(--gold);
            background: rgba(196, 165, 92, 0.2);
            transform: translateY(-2px);
        }

        nav a.active {
            background: var(--gold);
            color: var(--army-dark);
            border-color: var(--gold);
        }

        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 20px;
        }

        /* Военные секции */
        section {
            background: rgba(26, 47, 26, 0.9);
            backdrop-filter: blur(5px);
            border: 2px solid var(--gold);
            border-radius: 0;
            padding: 2.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* Уголки как на военных картах */
        section::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            width: 30px;
            height: 30px;
            border-top: 3px solid var(--gold);
            border-left: 3px solid var(--gold);
        }

        section::after {
            content: '';
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            border-bottom: 3px solid var(--gold);
            border-right: 3px solid var(--gold);
        }

        h2 {
            color: var(--gold);
            margin-bottom: 2rem;
            font-size: 2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 0.5rem;
            display: inline-block;
        }

        /* Военные звезды */
        .military-star {
            display: inline-block;
            margin-left: 10px;
            color: var(--gold);
        }

        /* Поле поиска */
        .search-section {
            background: linear-gradient(135deg, rgba(26, 47, 26, 0.95), rgba(43, 75, 43, 0.95));
            border-color: var(--gold);
        }

        .search-section input {
            flex: 1;
            min-width: 250px;
            padding: 15px 25px;
            border: 2px solid var(--sand);
            background: rgba(0, 0, 0, 0.5);
            color: var(--e8e0c9);
            font-size: 1rem;
            transition: all 0.3s;
            border-radius: 0;
        }

        .search-section input:focus {
            outline: none;
            border-color: var(--gold);
            background: rgba(0, 0, 0, 0.7);
        }

        .search-section input::placeholder {
            color: var(--sand);
            opacity: 0.7;
        }

        /* Военные кнопки */
        button {
            background: transparent;
            color: var(--gold);
            border: 2px solid var(--gold);
            padding: 15px 35px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            border-radius: 0;
        }

        button:hover {
            background: var(--gold);
            color: var(--army-dark);
            box-shadow: 0 0 20px var(--gold);
        }

        button:active {
            transform: scale(0.98);
        }

        /* Формы */
        .form-group {
            margin-bottom: 2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.8rem;
            font-weight: 600;
            color: var(--gold);
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid var(--sand);
            background: rgba(0, 0, 0, 0.5);
            color: var(--e8e0c9);
            font-size: 1rem;
            transition: all 0.3s;
            border-radius: 0;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--gold);
            background: rgba(0, 0, 0, 0.7);
        }

        /* Карточки поздравлений */
        .greeting-card {
            background: linear-gradient(135deg, var(--army-dark), var(--army-green));
            border: 2px solid var(--gold);
            padding: 2rem;
            margin-bottom: 1.5rem;
            position: relative;
            transition: all 0.3s ease;
        }

        .greeting-card:hover {
            transform: translateX(10px);
            border-color: var(--gold);
            box-shadow: -5px 5px 20px rgba(0,0,0,0.5);
        }

        .greeting-card .from {
            color: var(--sand);
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .greeting-card .to {
            color: var(--gold);
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .greeting-card .message {
            font-style: italic;
            background: rgba(0, 0, 0, 0.5);
            padding: 1.5rem;
            margin: 1rem 0;
            font-size: 1.1rem;
            line-height: 1.6;
            border-left: 4px solid var(--gold);
            color: var(--e8e0c9);
        }

        /* Модальное окно для входа */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--army-dark);
            border: 3px solid var(--gold);
            padding: 3rem;
            max-width: 400px;
            width: 90%;
            position: relative;
            box-shadow: 0 0 50px var(--gold);
        }

        .modal-content h2 {
            color: var(--gold);
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 1rem;
        }

        .modal-content input {
            width: 100%;
            padding: 15px;
            margin-bottom: 1.5rem;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--sand);
            color: var(--e8e0c9);
            font-size: 1rem;
        }

        .modal-content button {
            width: 100%;
        }

        .error-message {
            color: var(--blood);
            text-align: center;
            margin-top: 1rem;
            display: none;
        }

        /* Панель модерации (видна только после входа) */
        .moderation-section {
            border-color: var(--blood);
        }

        .moderation-section h2 {
            color: var(--blood);
            border-bottom-color: var(--blood);
        }

        .moderation-item {
            background: linear-gradient(135deg, #2a1a1a, #3b2a2a);
            border: 2px solid var(--blood);
            padding: 2rem;
            margin-bottom: 1.5rem;
            position: relative;
        }

        .moderation-item p {
            margin: 0.8rem 0;
            font-size: 1.1rem;
            color: var(--e8e0c9);
        }

        .moderation-item strong {
            color: var(--blood);
            font-weight: 600;
        }

        .moderation-item small {
            color: var(--sand);
        }

        .actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .actions button {
            flex: 1;
            padding: 12px;
        }

        .approve {
            border-color: #2b4b2b;
            color: #2b4b2b;
        }

        .approve:hover {
            background: #2b4b2b;
            color: var(--gold);
        }

        .reject {
            border-color: var(--blood);
            color: var(--blood);
        }

        .reject:hover {
            background: var(--blood);
            color: var(--gold);
        }

        /* Военная тематика для пустых состояний */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--sand);
            font-size: 1.2rem;
            border: 2px dashed var(--gold);
        }

        .empty-state::before {
            content: '🎖';
            font-size: 4rem;
            display: block;
            margin-bottom: 1rem;
            opacity: 0.7;
        }

        .loading {
            text-align: center;
            color: var(--sand);
            padding: 3rem;
            font-size: 1.2rem;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            margin-left: 10px;
            border: 3px solid var(--gold);
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .page {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .hidden {
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Сетка результатов */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .result-card {
            background: linear-gradient(135deg, var(--army-dark), var(--army-green));
            border: 2px solid var(--gold);
            padding: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
        }

        .result-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                text-align: center;
                gap: 1rem;
                padding: 1rem;
            }
            
            nav {
                width: 100%;
                justify-content: center;
            }
            
            .search-section {
                flex-direction: column;
            }
            
            .search-section button {
                width: 100%;
            }
            
            section {
                padding: 1.5rem;
            }
            
            h2 {
                font-size: 1.6rem;
            }
            
            .actions {
                flex-direction: column;
            }
            
            .modal-content {
                padding: 2rem;
            }
        }

        /* Секретная кнопка для входа в модерацию */
        .secret-entry {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: var(--army-dark);
            border: 2px solid var(--gold);
            cursor: pointer;
            opacity: 0.3;
            transition: all 0.3s;
            z-index: 100;
        }

        .secret-entry:hover {
            opacity: 1;
            background: var(--gold);
        }

        .secret-entry::before {
            content: '⚙️';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
        }

        /* Кнопка выхода */
        .logout-btn {
            background: transparent;
            border-color: var(--blood);
            color: var(--blood);
            padding: 5px 15px;
            font-size: 0.8rem;
            margin-left: 10px;
        }

        .logout-btn:hover {
            background: var(--blood);
            color: var(--gold);
        }
    </style>
</head>
<body>
    <header>
        <h1>23 февраля</h1>
        <nav>
            <a onclick="showPage('main')" id="nav-main" class="active">ГЛАВНАЯ</a>
            <a onclick="showModerationLogin()" id="nav-admin">ШТАБ</a>
        </nav>
    </header>

    <!-- Секретный вход в модерацию -->
    <div class="secret-entry" onclick="showModerationLogin()" title="Вход для командования"></div>

    <!-- Модальное окно для входа в модерацию -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <h2>ДОСТУП К ШТАБУ</h2>
            <input type="password" id="admin-password" placeholder="Введите пароль" onkeypress="if(event.key==='Enter') checkAdminPassword()">
            <button onclick="checkAdminPassword()">ВОЙТИ</button>
            <div id="login-error" class="error-message">Неверный пароль!</div>
        </div>
    </div>

    <main>
        <!-- Главная страница -->
        <div id="main-page" class="page">
            <section class="search-section">
                <h2>НАЙТИ ЗАЩИТНИКА <span class="military-star">⭐</span></h2>
                <input type="text" id="search-name" placeholder="Введите имя бойца..." autocomplete="off">
                <button onclick="searchGreetings()">
                    <span>🔍</span> НАЙТИ
                </button>
            </section>

            <section class="create-section">
                <h2>ДОБАВИТЬ ПОЗДРАВЛЕНИЕ <span class="military-star">⭐</span></h2>
                <form id="greeting-form" onsubmit="event.preventDefault(); addGreeting();">
                    <div class="form-group">
                        <label for="from-name">ОТ КОГО (Позывной)</label>
                        <input type="text" id="from-name" placeholder="Ваше имя" required>
                    </div>
                    <div class="form-group">
                        <label for="to-name">КОМУ (Имя защитника)</label>
                        <input type="text" id="to-name" placeholder="Имя бойца" required>
                    </div>
                    <div class="form-group">
                        <label for="message">ТЕКСТ ПОЗДРАВЛЕНИЯ</label>
                        <textarea id="message" rows="4" placeholder="Ваши пожелания..." required></textarea>
                    </div>
                    <button type="submit">
                        <span>📨</span> ОТПРАВИТЬ В ШТАБ
                    </button>
                </form>
            </section>

            <section class="results-section" id="results-section" style="display: none;">
                <h2>РЕЗУЛЬТАТЫ ПОИСКА <span class="military-star">⭐</span></h2>
                <div id="results-container" class="results-grid"></div>
            </section>
        </div>

        <!-- Страница модерации (доступна только после входа) -->
        <div id="admin-page" class="page hidden">
            <section class="moderation-section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                    <h2>ЗАЯВКИ НА ПРОВЕРКУ</h2>
                    <button class="logout-btn" onclick="logoutFromModeration()">ВЫХОД</button>
                </div>
                <div id="moderation-list">
                    <p class="loading">ЗАГРУЗКА ДАННЫХ</p>
                </div>
            </section>
        </div>
    </main>

    <script>
        // Константы для localStorage
        const STORAGE_KEYS = {
            PENDING: 'feb23_pending',
            APPROVED: 'feb23_approved'
        };

        // Пароль для доступа к модерации (можно изменить на свой)
        const ADMIN_PASSWORD = 'Trivial';

        // Флаг авторизации
        let isAuthenticated = false;

        // Инициализация при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            initStorage();
        });

        // Показать окно входа в модерацию
        function showModerationLogin() {
            document.getElementById('login-modal').classList.add('active');
            document.getElementById('admin-password').value = '';
            document.getElementById('login-error').style.display = 'none';
        }

        // Проверка пароля
        function checkAdminPassword() {
            const password = document.getElementById('admin-password').value;
            
            if (password === ADMIN_PASSWORD) {
                document.getElementById('login-modal').classList.remove('active');
                isAuthenticated = true;
                showPage('admin');
                updateModerationList();
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        // Выход из модерации
        function logoutFromModeration() {
            isAuthenticated = false;
            showPage('main');
        }

        // Переключение страниц
        function showPage(page) {
            const mainPage = document.getElementById('main-page');
            const adminPage = document.getElementById('admin-page');
            const navMain = document.getElementById('nav-main');
            const navAdmin = document.getElementById('nav-admin');

            if (page === 'main') {
                mainPage.classList.remove('hidden');
                adminPage.classList.add('hidden');
                navMain.classList.add('active');
                navAdmin.classList.remove('active');
            } else {
                if (!isAuthenticated) {
                    showModerationLogin();
                    return;
                }
                mainPage.classList.add('hidden');
                adminPage.classList.remove('hidden');
                navMain.classList.remove('active');
                navAdmin.classList.add('active');
            }
        }

        // Инициализация хранилища
        function initStorage() {
            if (!localStorage.getItem(STORAGE_KEYS.PENDING)) {
                localStorage.setItem(STORAGE_KEYS.PENDING, JSON.stringify([]));
            }
            if (!localStorage.getItem(STORAGE_KEYS.APPROVED)) {
                // Добавляем тестовые данные
                const testData = [
                    {
                        id: '1',
                        from: 'Товарищи',
                        to: 'Алексей',
                        message: 'С 23 февраля! Желаем крепкого здоровья, мужества и успехов в службе!',
                        approved: true,
                        timestamp: new Date().toISOString()
                    },
                    {
                        id: '2',
                        from: 'Семья',
                        to: 'Дмитрий',
                        message: 'С праздником, наш защитник! Мирного неба над головой!',
                        approved: true,
                        timestamp: new Date().toISOString()
                    }
                ];
                localStorage.setItem(STORAGE_KEYS.APPROVED, JSON.stringify(testData));
            }
        }

        // Получение данных из хранилища
        function getPendingGreetings() {
            return JSON.parse(localStorage.getItem(STORAGE_KEYS.PENDING)) || [];
        }

        function getApprovedGreetings() {
            return JSON.parse(localStorage.getItem(STORAGE_KEYS.APPROVED)) || [];
        }

        // Сохранение данных
        function savePendingGreetings(greetings) {
            localStorage.setItem(STORAGE_KEYS.PENDING, JSON.stringify(greetings));
        }

        function saveApprovedGreetings(greetings) {
            localStorage.setItem(STORAGE_KEYS.APPROVED, JSON.stringify(greetings));
        }

        // Генерация уникального ID
        function generateId() {
            return Date.now() + '-' + Math.random().toString(36).substr(2, 9);
        }

        // Добавление новой заявки
        function addGreeting() {
            const from = document.getElementById('from-name').value;
            const to = document.getElementById('to-name').value;
            const message = document.getElementById('message').value;

            if (!from || !to || !message) {
                alert('Заполните все поля!');
                return;
            }

            const pending = getPendingGreetings();
            const newGreeting = {
                id: generateId(),
                from: from.trim(),
                to: to.trim(),
                message: message.trim(),
                timestamp: new Date().toISOString()
            };
            pending.push(newGreeting);
            savePendingGreetings(pending);
            
            alert('Поздравление отправлено в штаб на проверку!');
            document.getElementById('greeting-form').reset();
        }

        // Одобрение заявки
        function approveGreeting(id) {
            if (!isAuthenticated) return;
            
            const pending = getPendingGreetings();
            const approved = getApprovedGreetings();
            
            const index = pending.findIndex(g => g.id === id);
            if (index !== -1) {
                const greeting = pending[index];
                greeting.approved = true;
                approved.push(greeting);
                pending.splice(index, 1);
                
                savePendingGreetings(pending);
                saveApprovedGreetings(approved);
                updateModerationList();
            }
        }

        // Отклонение заявки
        function rejectGreeting(id) {
            if (!isAuthenticated) return;
            
            if (confirm('Удалить эту заявку?')) {
                const pending = getPendingGreetings();
                const filtered = pending.filter(g => g.id !== id);
                savePendingGreetings(filtered);
                updateModerationList();
            }
        }

        // Обновление списка модерации
        function updateModerationList() {
            if (!isAuthenticated) return;
            
            const container = document.getElementById('moderation-list');
            const pending = getPendingGreetings();

            if (pending.length === 0) {
                container.innerHTML = '<div class="empty-state">Новых заявок нет</div>';
                return;
            }

            let html = '';
            pending.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            
            pending.forEach(greeting => {
                const date = new Date(greeting.timestamp).toLocaleString('ru-RU');
                html += `
                    <div class="moderation-item">
                        <p><strong>От:</strong> ${escapeHtml(greeting.from)}</p>
                        <p><strong>Кому:</strong> ${escapeHtml(greeting.to)}</p>
                        <p><strong>Поздравление:</strong></p>
                        <p class="message">${escapeHtml(greeting.message)}</p>
                        <p><small>${date}</small></p>
                        <div class="actions">
                            <button class="approve" onclick="approveGreeting('${greeting.id}')">
                                <span>✅</span> ОДОБРИТЬ
                            </button>
                            <button class="reject" onclick="rejectGreeting('${greeting.id}')">
                                <span>❌</span> ОТКЛОНИТЬ
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Поиск поздравлений
        function searchGreetings() {
            const searchName = document.getElementById('search-name').value.trim().toLowerCase();
            const resultsSection = document.getElementById('results-section');
            const resultsContainer = document.getElementById('results-container');

            if (!searchName) {
                alert('Введите имя для поиска');
                return;
            }

            const approved = getApprovedGreetings();
            const results = approved.filter(g => 
                g.to.toLowerCase().includes(searchName)
            );

            if (results.length === 0) {
                resultsContainer.innerHTML = `<div class="empty-state">Бойцов с именем "${searchName}" не найдено</div>`;
            } else {
                let html = '';
                results.forEach(greeting => {
                    html += `
                        <div class="result-card">
                            <div style="font-size: 2rem; margin-bottom: 1rem;">⭐</div>
                            <h3 style="color: var(--gold); font-size: 1.5rem; margin-bottom: 0.5rem;">${escapeHtml(greeting.to)}</h3>
                            <p style="color: var(--sand); margin-bottom: 1rem;">От: ${escapeHtml(greeting.from)}</p>
                            <p style="font-style: italic; line-height: 1.6;">"${escapeHtml(greeting.message)}"</p>
                        </div>
                    `;
                });
                resultsContainer.innerHTML = html;
            }

            resultsSection.style.display = 'block';
            resultsSection.scrollIntoView({ behavior: 'smooth' });
        }

        // Защита от XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
